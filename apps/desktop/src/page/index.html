<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'">
  <title>Sunroom</title>
  <style>
    html, body { margin: 0; height: 100%; background: #101010; color: #e8e8e8; font: 13px/1.4 system-ui, sans-serif; }
    body { display: grid; grid-template-rows: 1fr auto; }
    video { width: 100%; height: 100%; object-fit: contain; min-height: 0; }
    #info { padding: 8px 12px 48px; color: #a8a8a8; }
  </style>
</head>
<body>
  <video autoplay muted playsinline></video>
  <div id="info">Opening the camera...</div>
  <script src="page.js"></script>
</body>
</html>
