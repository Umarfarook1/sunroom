<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="sunroom" content="app">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#FAF7F2" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#161513" media="(prefers-color-scheme: dark)">
  <meta name="description" content="Sunroom makes a weak webcam in bad light look good. It runs in your browser and your video never leaves your device.">
  <title>Sunroom</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Ccircle cx='8' cy='8' r='7' fill='%23D9822B'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="theme.css">
  <link rel="stylesheet" href="app.css">
  <script type="module" src="main.js"></script>
</head>
<body data-view="waiting">
  <div class="viewer" id="viewer">
    <header class="bar">
      <h1 class="brand"><span class="mark" aria-hidden="true"></span>Sunroom</h1>
      <label class="picker" id="camera-picker" hidden>
        <span>Camera</span>
        <select id="camera"></select>
      </label>
    </header>

    <main>
      <div class="stage" id="stage" data-compare="on">
        <video id="enhanced" class="after" autoplay muted playsinline aria-label="Your camera, enhanced"></video>
        <div class="before"><video id="original" autoplay muted playsinline aria-label="Your camera as it is"></video></div>
        <span class="tag tag-before" id="tag-before" aria-hidden="true">Before</span>
        <span class="tag tag-after" id="tag-after" aria-hidden="true">After</span>
        <input class="split" id="split" type="range" min="0" max="100" step="1" value="50" aria-label="Before and after divider">
        <div class="divider" aria-hidden="true">
          <span class="knob">
            <svg width="18" height="18" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M6.5 5 2.5 9l4 4M11.5 5l4 4-4 4"/></svg>
          </span>
        </div>
        <div class="message" role="status">
          <h2 id="message-title">Waiting for your camera</h2>
          <p id="message-body">Allow camera access when your browser asks.</p>
          <button class="button" id="retry" type="button" hidden>Try again</button>
        </div>
      </div>

      <section class="panel" aria-label="What Sunroom is doing">
        <div class="readout">
          <p class="status"><span class="dot" aria-hidden="true"></span><span id="status">Starting</span></p>
          <p class="numbers"><span id="fps"></span> <span id="ms"></span> <span id="res"></span></p>
        </div>
        <div class="controls">
          <label class="switch master"><span>Enhance</span><input id="enhance" type="checkbox" role="switch" checked></label>
          <label class="switch"><span>Let Sunroom control the camera</span><input id="director" type="checkbox" role="switch" checked></label>
          <label class="switch"><span>Compare before and after</span><input id="compare" type="checkbox" role="switch" checked></label>
        </div>
      </section>

      <details class="advanced" id="advanced">
        <summary>Advanced</summary>
        <dl id="advanced-list"></dl>
      </details>
    </main>

    <p class="note">Everything runs in this tab. Your video never leaves this device.</p>
  </div>
</body>
</html>
