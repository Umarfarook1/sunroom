<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Sunroom</title>
<style>
  :root {
    --bg: #FAF7F2; --surface: #FFFFFF; --ink: #1B1A17; --muted: #6B665E; --hairline: #E6E0D6; --accent: #D9822B;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    color: var(--ink); background: var(--bg);
  }
  body { margin: 0; width: 300px; padding: 14px; box-sizing: border-box; font-size: 13px; line-height: 1.4; }
  header { display: flex; align-items: center; gap: 8px; margin: 0 0 12px; }
  header img { width: 20px; height: 20px; }
  h1 { font-size: 15px; font-weight: 600; margin: 0; }
  .card { background: var(--surface); border: 1px solid var(--hairline); border-radius: 10px; }
  label { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 11px 12px; cursor: pointer; }
  label + label { border-top: 1px solid var(--hairline); }
  .title { display: block; font-weight: 500; }
  .sub { display: block; color: var(--muted); font-size: 12px; overflow-wrap: anywhere; }
  label:has(input:disabled) { cursor: default; }
  label:has(input:disabled) .title { color: var(--muted); }
  input[role="switch"] {
    appearance: none; flex: none; margin: 0; position: relative; width: 34px; height: 20px; border-radius: 10px;
    background: var(--muted); cursor: inherit; transition: background-color 120ms ease-out;
  }
  input[role="switch"]::before {
    content: ""; position: absolute; top: 2px; left: 2px; width: 16px; height: 16px; border-radius: 50%;
    background: var(--surface); box-shadow: 0 1px 2px rgb(27 26 23 / 0.25); transition: transform 120ms ease-out;
  }
  input[role="switch"]:checked { background: var(--accent); }
  input[role="switch"]:checked::before { transform: translateX(14px); }
  input[role="switch"]:disabled { opacity: 0.45; }
  input[role="switch"]:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  #status { margin: 12px 2px 0; color: var(--muted); min-height: 2.8em; }
  @media (prefers-reduced-motion: reduce) { input[role="switch"], input[role="switch"]::before { transition: none; } }
</style>
</head>
<body>
  <header><img src="icons/48.png" alt=""><h1>Sunroom</h1></header>
  <div class="card">
    <label><span><span class="title">Improve my camera</span><span class="sub">On every site that uses the camera</span></span><input type="checkbox" role="switch" id="enabled"></label>
    <label><span><span class="title">On this site</span><span class="sub" id="site-name">This page</span></span><input type="checkbox" role="switch" id="site"></label>
    <label><span><span class="title">Let Sunroom control the camera</span><span class="sub">Sets exposure and gain so the picture keeps its frame rate</span></span><input type="checkbox" role="switch" id="director"></label>
  </div>
  <p id="status" role="status" aria-live="polite">Checking this tab</p>
  <script src="popup.js"></script>
</body>
</html>
